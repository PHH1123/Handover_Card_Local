# docker compose 의 frontend-static 서비스용 nginx 설정.
# 배포용 deploy/nginx.conf 와 구조는 같고, TLS 와 도메인만 뺐다(로컬은 HTTP).
# /api 는 같은 compose 네트워크의 backend 컨테이너로 넘긴다.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 녹음 파일 업로드. nginx 기본값이 1MB 라 이 줄이 없으면 긴 녹음이 413 으로 죽는다.
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- API 프록시 ----------
    location /api/ {
        # compose 네트워크의 서비스 이름. 도커 DNS 가 컨테이너 IP 로 풀어 준다.
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 백엔드 CORS 필터가 허용 목록에 없는 Origin 을 보면 엔드포인트에 닿기도 전에 막는다.
        # 브라우저는 같은 도메인이라도 POST 에 Origin 을 붙이므로 서버 간 요청에서는 떼어낸다.
        proxy_set_header Origin  "";
        proxy_set_header Referer "";

        # 업로드는 통째로 버퍼링하지 않고 흘려보낸다.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 라우팅. /cards/12 로 새로고침해도 index.html 을 돌려줘야 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
