# 가비아 클라우드 서버 nginx 설정.
# /etc/nginx/sites-available/handover-card 로 복사하고 sites-enabled 에 심볼릭 링크한다.
#
# 구조 —
#   정적 파일(dist)  : nginx 가 직접 서빙
#   /api/*           : 같은 서버의 스프링(8080) 으로 프록시
# 프론트가 같은 도메인의 /api 를 부르므로 브라우저 입장에서 CORS 가 아예 없다.
# (그래서 VITE_API_BASE_URL 은 비워둔 채로 빌드한다)

server {
    listen 80;
    listen [::]:80;
    server_name handover-card.example.com;   # ← 실제 도메인으로 바꾼다

    # certbot 이 인증서를 받을 때 쓰는 경로. 이것만 http 로 남기고 나머지는 https 로 보낸다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name handover-card.example.com;   # ← 실제 도메인으로 바꾼다

    # certbot --nginx 로 발급하면 이 두 줄은 자동으로 채워진다.
    ssl_certificate     /etc/letsencrypt/live/handover-card.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/handover-card.example.com/privkey.pem;

    root /var/www/handover-card;
    index index.html;

    # 녹음 파일 업로드. nginx 기본값이 1MB 라 이 줄이 없으면 긴 녹음이 413 으로 죽는다.
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- API 프록시 ----------
    location /api/ {
        # 스프링이 같은 서버에 있을 때. 다른 호스트면 https://api.handover-card.o-r.kr 로 바꾼다.
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 백엔드의 CORS 필터가 허용 목록에 없는 Origin 을 보면 엔드포인트에 닿기도 전에
        # "Invalid CORS request" 로 막는다. 브라우저는 같은 도메인이라도 POST·PUT·DELETE 에
        # Origin 을 붙이므로, 안 지우면 화면은 뜨는데 로그인·회원가입만 죽는다.
        # 백엔드가 이 도메인을 허용 목록에 넣어 주면 아래 두 줄을 지워도 된다.
        proxy_set_header Origin  "";
        proxy_set_header Referer "";

        # 업로드는 통째로 버퍼링하지 않고 흘려보낸다.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------- 정적 파일 ----------
    # 파일명에 해시가 박혀 있어서 영구 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 은 절대 캐시하지 않는다. 캐시되면 배포해도 옛 번들을 계속 불러온다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 라우팅. /cards/12 같은 주소로 새로고침해도 index.html 을 돌려줘야 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
